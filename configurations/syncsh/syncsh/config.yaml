---
version: 1
sync:
    enabled: true
    transport: rclone
    rclone:
        engine: embedded
        primary: gdrive
        remotes:
            - id: gdrive
              name: gdrive
              rclone_remote: gdrive
              provider: custom
              path: syncsh
              enabled: true
suggest:
    enabled: true
    menu: true
    menu_max: 12
    accept:
        - Right
