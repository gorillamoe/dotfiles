# yaml-language-server: $schema=https://remnix.app/config.schema.json
---
version: 2
sync:
  enabled: true
  rclone_engine: embedded
  endpoints:
    - id: remnix-google-drive
      type: rclone
      name: Google Drive
      enabled: true
      rclone_remote: remnix-google-drive
      provider: google-drive
      path: remnix
  interval: 5m
  gc_interval: 1h
  callbacks: []
suggest:
  enabled: true
  menu: true
  menu_max: 12
  completions: true
  accept:
    - Right
  icons:
    typed: "›"
    history: "*"
    completion: "+"
pty_proxy:
  enabled: true
  height: 40
daemon:
  compact_interval: 5m
  config_watch_interval: 30s
disable_auto_migrate: false
ui:
  colors:
    accent: "#EE5396"
    title: "#C49BFF"
    muted: "#8D8D8D"
    rule: "#393939"
    badge: "#33B1FF"
    duration: "#55E07A"
    failed: "#FF4D6D"
    time: "#8D8D8D"
    text: "#DDE1E6"
    syntax:
      command: "#33B1FF"
      keyword: "#EE5396"
      flag: "#FFB655"
      string: "#55E07A"
      comment: "#8D8D8D"
      operator: "#FF7EB6"
      variable: "#C49BFF"
      path: "#78C6FF"
      number: "#FFD970"
      argument: "#DDE1E6"
  icons:
    cursor: "❯"
    suggestion_typed: "›"
    suggestion_history: "*"
    suggestion_completion: "+"
    separator: "·"
    move_up_down: "↑↓"
