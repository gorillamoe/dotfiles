---
configurations:
  # syncsh - privacy focused Atuin clone
  - name: syncsh
    files:
      - source: syncsh
        destination: $HOME/.config/syncsh
  # Gromit-MPX
  # Screen annotation tool that works with any Unix desktop environment
  # under X11 as well as Wayland.
  # Map buttons in Gnome-Settings > Graphics Tablets > Map Buttons:
  # (    F9     |     F8    |  Shift+F8  |  Shift+F9  )
  - name: gromit-mpx
    files:
      - source: gromit-mpx.cfg
        destination: $HOME/.config/gromit-mpx.cfg
      - source: gromit-mpx.ini
        destination: $HOME/.config/gromit-mpx.ini
  # ws (withsecrets.com - minimalist doppler.com) configuration
  - name: withsecrets
    files:
      - source: withsecrets
        destination: $HOME/.config/withsecrets/
  # Kitty Terminal
  - name: kitty
    files:
      - source: kitty
        destination: $HOME/.config/kitty
  # Icons
  - name: icons
    files:
      - source: candy-icons
        destination: $HOME/.icons/candy-icons/
  # halloy irc client configuration
  - name: halloy
    files:
      - source: halloy
        destination: $HOME/.config/halloy
  # wallpaper and avatars
  - name: pictures
    files:
      - source: wallpapers
        destination: $HOME/Pictures/wallpapers
      - source: avatars
        destination: $HOME/Pictures/avatars
  # sane defaults for editorconfig
  - name: editorconfig
    files:
      - source: .editorconfig
        destination: $HOME/.editorconfig
  # My scripts
  - name: scripts
    files:
      - source: scripts
        destination: $HOME/.local/scripts
  # mise configuration
  - name: mise
    files:
      - source: mise
        destination: $HOME/.config/mise
  # zsh configuration
  - name: zsh
    files:
      - source: .zshrc
        destination: $HOME/.zshrc
  # oh my posh configuration
  - name: oh-my-posh
    files:
      - source: oh-my-posh
        destination: $HOME/.config/oh-my-posh
  # sane defaults for git
  - name: git
    files:
      - source: .gitconfig
        destination: $HOME/.gitconfig
      - source: work/.gitconfig
        destination: $HOME/projects/work/.gitconfig
  # sane defaults for jj
  - name: jj
    files:
      - source: jj
        destination: $HOME/.config/jj
  # sane defaults for wezterm
  - name: wezterm
    files:
      - source: wezterm
        destination: $HOME/.config/wezterm
  # sane defaults for ssh
  - name: ssh
    files:
      - source: .ssh/config
        destination: $HOME/.ssh/config
  # nvpm 🌈 package manager 📦 configuration
  - name: nvpm
    files:
      - source: nvpm
        destination: $HOME/.config/nvpm
  # Vale linter configuration
  - name: vale
    files:
      - source: .vale
        destination: $HOME/.vale
      - source: vale.ini
        destination: $HOME/vale.ini
